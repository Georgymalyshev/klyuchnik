name: "Ключник"
description: "Ищет ключи российских сервисов и российские персональные данные в коде"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: |
        python -m pip install --quiet "${{ github.action_path }}"
        klyuchnik-install --gitleaks-only
        klyuchnik-scan "${{ github.workspace }}"
