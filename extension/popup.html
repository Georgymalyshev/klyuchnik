<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ключник</title>
<style>
  body { width: 300px; margin: 0; padding: 14px 16px; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         color: #1b1b1f; background: #fff; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: #5d5f6b; margin: 0 0 12px; font-size: 13px; }
  label { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  td { padding: 3px 0; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  button { font: inherit; width: 100%; margin-top: 6px; padding: 7px; border-radius: 8px;
           border: 1px solid #c4c6d0; background: #fff; cursor: pointer; }
  #copied { color: #1f7a3a; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
  <h1>Ключник</h1>
  <p class="sub">Проверяет сообщения в GigaChat, Алисе и DeepSeek до отправки. Всё работает только на этом компьютере.</p>
  <label><input type="checkbox" id="enabled"> Защита включена</label>
  <table>
    <tr><td>Предупреждений</td><td id="alarms">0</td></tr>
    <tr><td>Скрыто секретов</td><td id="masked">0</td></tr>
    <tr><td>Вернулись к тексту</td><td id="cancelled">0</td></tr>
    <tr><td>Отправили всё равно</td><td id="sentAnyway">0</td></tr>
    <tr><td>Выключали защиту</td><td id="disabledTimes">0</td></tr>
  </table>
  <button id="test">Открыть тестовую страницу</button>
  <button id="copy">Скопировать статистику</button>
  <div id="copied"></div>
  <script src="popup.js"></script>
</body>
</html>
