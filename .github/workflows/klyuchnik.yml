name: Ключник

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Поставить gitleaks (со сверкой контрольной суммы)
        run: python -m klyuchnik.install --gitleaks-only
      - name: Тесты
        run: python -m unittest -v

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ключник проверяет сам себя
        uses: ./
